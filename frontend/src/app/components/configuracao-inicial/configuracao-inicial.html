<app-fundo-auth />

<main class="centro">
  <app-logo />

  <div class="card largo">
    <app-etapas-cadastro [atual]="2" />

    <div class="cabecalho">
      <h1>Bem-vindo{{ primeiroNome() ? ', ' + primeiroNome() : '' }}!</h1>
      <p class="subtitulo">
        Escolha o que você quer usar. Dá para mudar depois em Funcionalidades.
      </p>
    </div>

    @if (erro()) {
      <div class="aviso erro" role="alert"><mat-icon>error_outline</mat-icon> {{ erro() }}</div>
    }

    @if (pessoal()) {
      <app-seletor-modulos [opcoes]="opcoes" [(selecionados)]="modulos" />
    }

    <button mat-flat-button class="btn-principal" type="button" (click)="entrar()" [disabled]="salvando()">
      @if (salvando()) {
        <mat-spinner diameter="20" />
      } @else {
        <span class="conteudo-btn">Entrar no sistema <mat-icon>arrow_forward</mat-icon></span>
      }
    </button>
  </div>
</main>
